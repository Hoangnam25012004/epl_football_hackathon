[project]
name = "pundit"
version = "0.1.0"
description = "Pundit Copilot: synthetic football match engine, match state and stats tools"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.8,<3"]

[project.scripts]
pundit = "pundit.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pundit"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "jsonschema>=4.22",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers -m \"not slow\""
markers = [
    "slow: many seeds; run with `pytest -m slow`",
    "perf: time-budget checks",
]

[tool.coverage.run]
source = ["pundit"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
strict = true
packages = ["pundit"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"random.random".msg = "Use rng_stream(seed, attempt, name) from pundit.engine.rng"
"random.choice".msg = "Use rng_stream(seed, attempt, name) from pundit.engine.rng"
"random.choices".msg = "Use rng_stream(seed, attempt, name) from pundit.engine.rng"
"random.randint".msg = "Use rng_stream(seed, attempt, name) from pundit.engine.rng"
"random.uniform".msg = "Use rng_stream(seed, attempt, name) from pundit.engine.rng"
"random.gauss".msg = "Use rng_stream(seed, attempt, name) from pundit.engine.rng"
"random.shuffle".msg = "Use rng_stream(seed, attempt, name) from pundit.engine.rng"
"random.seed".msg = "Never seed the global RNG"
"uuid.uuid4".msg = "IDs must be deterministic, see pundit.domain.ids"
"datetime.datetime.now".msg = "Generated data must not depend on wall-clock time"
"time.time".msg = "Use a Clock (pundit.engine.replay)"
