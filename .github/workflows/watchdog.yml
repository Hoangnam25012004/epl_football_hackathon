name: watchdog

# Keepalive layer 2 (docs/day7-design.md section 3.5): every 20 minutes, check the public demo and
# restart the Hugging Face Space when it sleeps or fails; outages open an issue labelled
# `demo-down`, closed by the next healthy run. Disable after 10/11/2026 (section 3.19).
#
# Repository settings: secret HF_TOKEN; variables HF_SPACE (owner/name) and DEMO_URL.

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

concurrency:
  group: watchdog
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/ops

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install the Hugging Face client
        run: python -m pip install --quiet huggingface_hub==2.2.0

      - name: check the demo
        env:
          HF_SPACE: ${{ vars.HF_SPACE }}
          DEMO_URL: ${{ vars.DEMO_URL }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python tools/ops/watchdog.py
