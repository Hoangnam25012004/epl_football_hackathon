name: ci

on: [push, pull_request]

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    env:
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: tests with coverage
        run: uv run pytest -m "not slow and not perf and not live" --cov=pundit --cov-fail-under=85
      - name: time budgets (no coverage)
        run: uv run pytest -m perf
      - name: claim checker eval gate (mock)
        run: uv run pundit eval --min-accuracy 0.85

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: secrets in the whole history and the working tree
        run: uv run --no-project python tools/security/scan_secrets.py --history --worktree
      - name: Official Rules (no real names, no logos)
        run: uv run --no-project python tools/security/scan_compliance.py
      - name: scanner tests
        run: uv run --locked --project backend pytest tools/security
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: npm ci
      - name: contracts generated from the current schemas
        run: npm run gen:types && git diff --exit-code -- src/lib/contracts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run test
      - run: npm run build
      - name: first-load JS budget
        run: npm run size
      - name: backend for the E2E
        working-directory: backend
        run: uv sync --locked
      - run: npx playwright install --with-deps chromium
      - name: E2E (real backend with mock LLM, and recorded streams)
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: frontend/test-results
          retention-days: 7
